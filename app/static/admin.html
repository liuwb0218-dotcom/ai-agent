<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · AI 智能客服 Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
  <div class="bg-decor" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="admin-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">AI</div>
        <div class="brand-text">
          <h1>管理后台</h1>
          <span class="brand-sub">用户管理 · 角色与状态</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="themeBtn" title="切换主题">◐</button>
        <button class="btn" id="backBtn">← 返回聊天</button>
        <button class="btn btn-danger" id="logoutBtn">🚪 退出登录</button>
      </div>
    </header>

    <main class="admin-main">
      <nav class="admin-tabs">
        <button class="tab-btn active" data-tab="users">👥 用户管理</button>
        <button class="tab-btn" data-tab="orders">📦 订单管理</button>
        <button class="tab-btn" data-tab="knowledge">📚 知识库</button>
      </nav>

      <div id="panelUsers">
        <div class="admin-toolbar">
          <input class="admin-search" id="searchInput" placeholder="搜索用户名 / 昵称 / 邮箱…">
          <button class="btn btn-primary" id="searchBtn">搜索</button>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th><th>用户名</th><th>昵称</th><th>邮箱</th>
                <th>角色</th><th>状态</th><th>创建时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="userRows"><tr><td colspan="8" class="admin-empty">加载中…</td></tr></tbody>
          </table>
        </div>

        <div class="admin-pager">
          <button class="btn" id="prevBtn">← 上一页</button>
          <span id="pageInfo">第 1 页</span>
          <button class="btn" id="nextBtn">下一页 →</button>
        </div>
      </div>

      <div id="panelKnowledge" hidden>
        <div class="admin-toolbar">
          <label class="btn" for="kbFile">📤 上传文档（md/txt/docx，≤5MB）<input type="file" id="kbFile" accept=".md,.txt,.docx" hidden></label>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>文档名</th><th>分块数</th><th>导入时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="kbRows"><tr><td colspan="4" class="admin-empty">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div id="panelOrders" hidden>
        <div class="admin-toolbar">
          <select class="role-select" id="orderStatusFilter">
            <option value="">全部状态</option>
            <option>待支付</option><option>已支付</option><option>已发货</option><option>已完成</option><option>已取消</option>
          </select>
          <input class="admin-search" id="orderSearchInput" placeholder="搜索订单号 / 商品名…">
          <button class="btn btn-primary" id="orderSearchBtn">搜索</button>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th><th>订单号</th><th>用户 ID</th><th>商品</th><th>数量</th>
                <th>金额</th><th>状态</th><th>下单时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="orderRows"><tr><td colspan="9" class="admin-empty">加载中…</td></tr></tbody>
          </table>
        </div>

        <div class="admin-pager">
          <button class="btn" id="orderPrevBtn">← 上一页</button>
          <span id="orderPageInfo">第 1 页</span>
          <button class="btn" id="orderNextBtn">下一页 →</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>
